[run]
branch = true
relative_files = true
source =
    humansays
omit =
    */__main__.py

[report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
skip_empty = true
sort = Cover

exclude_also =
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    @(abc\.)?abstractmethod


[html]
directory = htmlcov
skip_covered = true
skip_empty = true

[xml]
output = coverage.xml
