name: Reusable Python tests

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: false
        type: string
        default: ""
      python-versions:
        description: JSON array of Python versions
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'

permissions:
  contents: read

env:
  ACTION_RUNNER_LABEL: ${{ inputs.runner || vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}

jobs:
  linter:
    name: Code Linter
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap Runner
        uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
          groups: lint

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: 3.10.0

      - name: Run Linter
        run: ./scripts/lint.sh
        env:
          UV_NO_SYNC: "1"

  # The four version jobs run concurrently at roughly 11 seconds each; whole-CI
  # wall clock is about 54 seconds. Collapsing them into one job with a
  # `uv run --python X.Y` loop was measured and rejected: it serializes the
  # runs, `uv run --python` recreates .venv in place and so defeats setup-uv's
  # uv.lock cache, and the repo is public, so Actions minutes are free. The
  # only gain would be per-version failure attribution, which the matrix
  # already provides.
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ inputs.runner || vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
          groups: test

      - name: Run tests
        run: |
          uv run --locked --no-default-groups --group test pytest
