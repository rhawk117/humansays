name: Documentation

# Disabled in CI: docs/ is being restructured and mkdocs currently fails to
# build. Kept as a repository artifact, runnable manually until the docs
# restructuring lands.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    uses: ./.github/workflows/upload-mkdocs.yml
    with:
      upload-artifact: ${{ github.event_name != 'pull_request' }}

  deploy:
    name: Deploy documentation
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-docs
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
