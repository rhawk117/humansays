name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0a1
        required: true
        type: string
      index:
        description: Which index to publish to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify Tag Matches Project Version
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      index: ${{ inputs.index || 'pypi' }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Bootstrap Runner
        uses: ./.github/actions/bootstrap
        with:
          python-version: "3.14"
          sync: "false"

      - name: Verify Tag
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="$(uv version --short)"
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            printf '::error::tag %s does not match project version %s\n' \
              "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" =~ (a|b|rc)[0-9]+|\.dev[0-9]+ ]]; then
            prerelease=true
          fi

          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
            printf 'prerelease=%s\n' "$prerelease"
          } >>"$GITHUB_OUTPUT"

  continuous-integration:
    needs: verify
    uses: ./.github/workflows/ci-playbook.yml

  package:
    needs: [verify, continuous-integration]
    uses: ./.github/workflows/build-package.yml
    with:
      artifact-name: release-distributions

  publish:
    name: Publish to ${{ needs.verify.outputs.index }}
    needs: [verify, package]
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    environment:
      name: ${{ needs.verify.outputs.index }}
      url: https://pypi.org/project/humansays/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Publish Distributions
        env:
          TARGET_INDEX: ${{ needs.verify.outputs.index }}
        run: |
          set -euo pipefail

          args=(publish --trusted-publishing always)
          if [[ "$TARGET_INDEX" == "testpypi" ]]; then
            args+=(--publish-url https://test.pypi.org/legacy/)
          fi

          uv "${args[@]}" dist/*

  github-release:
    name: Publish GitHub Release
    needs: [verify, package, publish]
    if: ${{ needs.verify.outputs.index == 'pypi' }}
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    env:
      IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      ARTIFACT_NAME: ${{ needs.package.outputs.artifact-name }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/

      - name: Create/Repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find dist -maxdepth 1 -type f -print)

          if ((${#assets[@]} == 0)); then
            printf '::error::no release assets were downloaded.\n' >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi

          args=(
            release create "$RELEASE_TAG"
            "${assets[@]}"
            --generate-notes
            --title "$RELEASE_TAG"
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
