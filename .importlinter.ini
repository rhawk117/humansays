
[importlinter]
root_package = humansays
include_external_packages = True
exclude_type_checking_imports = False

[importlinter:contract:acyclic-package]
name = Package structure must remain acyclic
type = acyclic_siblings
ancestors =
    humansays
depth = 2
unmatched_ignore_imports_alerting = error

[importlinter:contract:ast-confined-to-analysis]
name = Only humansays.analysis may import ast or tokenize
type = forbidden
source_modules =
    humansays.__main__
    humansays.application
    humansays.catalog
    humansays.cli
    humansays.config
    humansays.config.loading
    humansays.config.models
    humansays.const
    humansays.enums
    humansays.factories
    humansays.facts
    humansays.facts.module
    humansays.facts.values
    humansays.findings
    humansays.findings.models
    humansays.reporting
    humansays.reporting.ansi
    humansays.reporting.console
    humansays.reporting.grouping
    humansays.reporting.models
    humansays.reporting.payload
    humansays.reporting.render
    humansays.reporting.renderers
    humansays.reporting.terminal
    humansays.scoring
    humansays.signals
    humansays.signals.cohesion
    humansays.signals.effects
    humansays.signals.evaluation
    humansays.signals.scope
    humansays.signals.shape
    humansays.signals.signature
    humansays.signals.structure
forbidden_modules =
    ast
    tokenize
allow_indirect_imports = True

; analysis sits above signals only while the RulesetEvaluator shim survives.
; Once the shim is gone the two become independent siblings written with |,
; which forbids the import in both directions.
[importlinter:contract:layers]
name = High-level modules must not be depended on by lower layers
type = layers
layers =
    humansays.application
    humansays.scoring
    humansays.reporting
    humansays.analysis
    humansays.signals
    humansays.catalog
    humansays.config
    humansays.facts
    humansays.findings
