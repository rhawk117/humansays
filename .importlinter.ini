
[importlinter]
root_package = humansays
include_external_packages = True
exclude_type_checking_imports = False

[importlinter:contract:acyclic-package]
name = Package structure must remain acyclic
type = acyclic_siblings
ancestors =
    humansays
depth = 2
unmatched_ignore_imports_alerting = error

[importlinter:contract:ast-confined-to-analysis]
name = Only humansays.analysis may import ast or tokenize
type = forbidden
source_modules =
    humansays.__main__
    humansays.application
    humansays.cli
    humansays.config
    humansays.config.loading
    humansays.config.models
    humansays.const
    humansays.enums
    humansays.factories
    humansays.facts
    humansays.facts.module
    humansays.facts.values
    humansays.findings
    humansays.findings.models
    humansays.reporting
    humansays.reporting.ansi
    humansays.reporting.console
    humansays.reporting.grouping
    humansays.reporting.models
    humansays.reporting.payload
    humansays.reporting.render
    humansays.reporting.renderers
    humansays.reporting.terminal
    humansays.rules
    humansays.rules.contract
    humansays.rules.contract.adapters
    humansays.rules.encap
    humansays.rules.encap.adapters
    humansays.rules.err
    humansays.rules.err.adapters
    humansays.rules.evaluation
    humansays.rules.idiom
    humansays.rules.idiom.adapters
    humansays.rules.kiss
    humansays.rules.kiss.adapters
    humansays.rules.loading
    humansays.rules.models
    humansays.rules.protocol
    humansays.rules.registry
    humansays.rules.smell
    humansays.rules.smell.adapters
    humansays.rules.solid
    humansays.rules.solid.class_shape
    humansays.rules.solid.cohesion
    humansays.rules.solid.effects
    humansays.rules.solid.signature
    humansays.rules.yagni
    humansays.rules.yagni.adapters
    humansays.scoring
forbidden_modules =
    ast
    tokenize
allow_indirect_imports = True

; analysis and rules are independent siblings, written with | rather than :
; so the ban runs in both directions. A : would permit analysis importing
; rules, which is the direction the extraction/evaluation split exists to
; stop. They meet only at humansays.facts.
[importlinter:contract:layers]
name = High-level modules must not be depended on by lower layers
type = layers
layers =
    humansays.application
    humansays.scoring
    humansays.reporting
    humansays.analysis | humansays.rules
    humansays.config
    humansays.facts
    humansays.findings
