line-length = 90
preview = false
unsafe-fixes = false
# Vendored third-party fixture corpus, not humansays code -- not ours to lint.
# docs/ is mid-restructuring in a separate workstream -- not ours to format.
extend-exclude = ["tests/golden/poc-parity/corpus", "docs"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "FAST",
    "S",
    "ERA",
    "G",
    "ASYNC",
    "PERF",
    "B",
    "TID",
    "SIM",
    "C4",
    "DTZ",
    "PTH",
    "PT",
    "A",
    "LOG",
    "TC",
    "PGH",
    "FURB",
    "RUF",
    "TRY",
    "N",
    "FLY",
    "COM",
    "EXE",
    "PIE",
    "C901",
    "D404",
    "D417",
    "D419",
    "RET",
    "SLF",
    "RSE",
    "PYI",
    "ARG",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "FBT001",
    "FBT002",
]

ignore = [
    "COM812",
    "PGH003",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",
    "RUF012",
    "RUF029",
    "TRY400",
    "TRY003",
    "TRY301",
    "S101",
    "S104",
    "S105",
    "S106",
]
[lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "S101"]
# Deliberately smelly fixture, byte-for-byte ported from the POC: its
# lint violations are the point (each one is what a specific rule detects).
"tests/fixture_module.py" = ["ANN001", "ANN201", "ANN205", "E731", "FBT002", "RET505", "SIM116"]
# Ported verbatim from the POC's unittest.TestCase suite; assertions are kept
# as unittest-style (not rewritten to plain assert) per the migration plan.
"tests/parity/*.py" = ["PT009", "SIM115"]

[lint.mccabe]
max-complexity = 10


[lint.flake8-quotes]
docstring-quotes = "single"

[lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = false
strict = false

runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "msgspec.Struct",
]

runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "pydantic.dataclasses.dataclass",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.head",
]

[lint.pylint]
allow-dunder-method-names = ["__tablename__", "__table_args__"]

[format]
docstring-code-format = true
preview = true
quote-style = "single"
