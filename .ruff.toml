line-length = 90
preview = false
unsafe-fixes = false
# Vendored third-party fixture corpus, not humansays code -- not ours to lint.
# docs/ is published prose; .agent-specs/ is agent execution material.
extend-exclude = ["tests/golden/poc-parity/corpus", "docs", ".agent-specs"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "FAST",
    "S",
    "ERA",
    "G",
    "ASYNC",
    "PERF",
    "B",
    "TID",
    "SIM",
    "C4",
    "DTZ",
    "PTH",
    "PT",
    "A",
    "LOG",
    "TC",
    "PGH",
    "FURB",
    "RUF",
    "TRY",
    "N",
    "FLY",
    "COM",
    "EXE",
    "PIE",
    "C901",
    "D404",
    "D417",
    "D419",
    "RET",
    "SLF",
    "RSE",
    "PYI",
    "ARG",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "FBT001",
    "FBT002",
    "YTT",    # Unsafe or fragile Python-version checks
    "BLE",    # Blind Exception/BaseException handling
    "T10",    # Forgotten debugger calls
    "ISC004", # Accidental string concatenation inside collections
    "INP",    # Missing __init__.py files
    "SLOT",   # Missing slots on immutable builtin subclasses
    "PL",     # Ruff's Pylint correctness and structural rules
    "ANN002", # Missing *args annotation
    "ANN003", # Missing **kwargs annotation
    "FBT003", # Positional Boolean at call sites
    "D418",   # Docstring incorrectly attached to @overload
]

ignore = [
    "COM812",
    "PGH003",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "TRY400",
    "TRY003",
    "TRY301",
    "S101",
    "S104",
    "S105",
    "S106",
]
[lint.per-file-ignores]
# Standalone entry points invoked by path, not an importable package.
"scripts/**/*.py" = ["INP001"]
"tests/**/*.py" = ["ARG001", "ARG002", "INP001", "PLR2004", "S101", "PLC0415"]
# Deliberately smelly fixture, byte-for-byte ported from the POC: its
# lint violations are the point (each one is what a specific rule detects).
"tests/fixture_module.py" = [
    "ANN001",
    "ANN201",
    "ANN205",
    "E731",
    "FBT002",
    "PLR0911",
    "RET505",
    "SIM116",
]
# Ported verbatim from the POC's unittest.TestCase suite; assertions are kept
# as unittest-style (not rewritten to plain assert) per the migration plan.
"tests/parity/*.py" = ["PT009", "SIM115"]

[lint.mccabe]
max-complexity = 10


[lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = false
strict = false

runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "msgspec.Struct",
]

runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "pydantic.dataclasses.dataclass",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.head",
]

[lint.pylint]
allow-dunder-method-names = ["__tablename__", "__table_args__"]

[format]
docstring-code-format = true
preview = true
quote-style = "single"
