site_name: humansays
site_description: An AST-based structural reviewer for agent-generated Python
site_url: https://rhawk117.github.io/humansays/

repo_name: rhawk117/humansays
repo_url: https://github.com/rhawk117/humansays
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            members_order: source
            show_source: false
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Development:
      - MVP: development/MVP.md
      - Design: development/DESIGN.md
      - Rust migration: development/RUST.md
