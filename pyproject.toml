[project]
name = "humansays"
version = "0.1.0a2"
requires-python = ">=3.11"
description = "A linting guardrail for LLM-generated Python code which raises structural doubts and a per-finding score before the code reaches a reviewer"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
keywords = ["lint", "linter", "static-analysis", "llm", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/rhawk117/humansays"
Repository = "https://github.com/rhawk117/humansays"
Issues = "https://github.com/rhawk117/humansays/issues"
Changelog = "https://github.com/rhawk117/humansays/releases"

[project.scripts]
humansays = "humansays.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "package" },
    { include-group = "lint" },
    { include-group = "test" },
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-llmstxt>=0.5.0",
    "termynal>=0.14.0",
]
lint = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "import-linter>=2.13",
    "mdformat>=0.7.22",
    "mdformat-gfm>=1.0.0",
    # mdformat-mkdocs 5.x renders mkdocs admonitions and content tabs itself, so
    # mdformat-admon is not added alongside it: both register a renderer for
    # "admonition" and "admonition_title", and mdformat resolves that conflict
    # arbitrarily while printing a warning on every run.
    "mdformat-mkdocs>=5.2.1",
    "pymarkdownlnt>=0.9.39",
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "vulture>=2.16",
]
package = ["twine>=6.2.0"]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.14" }
docs = { requires-python = ">=3.12" }
lint = { requires-python = ">=3.14" }


[tool.deptry]
ignore_notebooks = true
extend_exclude = ["(^|/)(build|dist|generated)(/|$)"]

[tool.deptry.per_rule_ignores]
# DEP002 = ["uvicorn"]

[tool.deptry.package_module_name_map]
# "python-dateutil" = "dateutil"

# Markdown linting covers docs/site/, the published mkdocs site. docs/evidence/
# is excluded: mkdocs never builds it, and it is an append-only archive of
# measured results that is re-run rather than re-edited.
#
# Every rule disabled below states why. A disabled rule with no reason is a
# defect. The list was derived from an actual scan of docs/site/, not predicted.
[tool.pymarkdown]
plugins.md013.enabled = false   # line-length: table rows and reference URLs cannot wrap
plugins.md038.enabled = false   # spaces-in-code-span: the output docs quote separator
                                # strings such as `, ` where the space is the content
plugins.md046.enabled = false   # code-block-style: pymarkdown does not parse mkdocs
                                # admonitions, so it reads every 4-space-indented
                                # admonition body as an indented code block. All four
                                # hits were admonition prose, none a code block.
plugins.md024.siblings_only = true  # duplicate-heading: sub-headings such as
                                    # "Good criteria" recur under different parents
                                    # by design, and every rule entry will repeat
                                    # the same sub-headings after the catalog rewrite

[tool.vulture]
paths = ["src", "tests"]

exclude = ["*/generated/*"]

min_confidence = 100
sort_by_size = true
make_whitelist = false
verbose = false
