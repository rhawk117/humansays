# Rules about how much a reader has to hold in their head at once.
#
# weight 3.0 is WARNING, weight 1.0 is ADVISORY. There are no other severities.

[[rule]]
id = "HS003"
severity = "warning"
disposition = "on"
confidence = 0.76
weight = 3.0
message = "Control flow reaches nesting depth {depth}."
review_question = """\
Would guard clauses, a state model, or one meaningful extraction \
clarify the control flow?"""

[[rule]]
id = "HS009"
severity = "advisory"
disposition = "on"
confidence = 0.55
weight = 1.0
message = "Function spans {count} source lines."
review_question = """\
Is the function cohesive, or does it mix workflow, decisions, \
and lower-level mechanics?"""

[[rule]]
id = "HS017"
severity = "warning"
disposition = "on"
confidence = 0.60
weight = 3.0
message = "Module spans {count} source lines."
review_question = """\
Does this file hold one subject, or have several modules been \
accumulated into one namespace?"""

[[rule]]
id = "HS019"
severity = "warning"
disposition = "on"
confidence = 0.74
weight = 3.0
message = "Function contains {count} if/elif statements."
review_question = """\
Do these conditionals encode one decision that belongs in a \
table, mapping, or polymorphic dispatch?"""

[[rule]]
id = "HS022"
severity = "warning"
disposition = "on"
confidence = 0.72
weight = 3.0
message = "Function holds {count} lines of code."
review_question = """\
How many distinct steps are in here, and which of them has a name already?"""
