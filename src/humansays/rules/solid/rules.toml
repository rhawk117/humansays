# Rules about responsibility boundaries: what one unit owns and what it defers.
#
# weight 3.0 is WARNING, weight 1.0 is ADVISORY. There are no other severities.

[[rule]]
id = "HS002"
severity = "advisory"
confidence = 0.82
weight = 1.0
message = "Boolean parameters select behavior or operating modes."
review_question = """\
Would keyword-only arguments, an enum, or separate operations \
communicate the modes better?"""

[[rule]]
id = "HS007"
severity = "warning"
confidence = 0.65
weight = 3.0
message = "Function uses {count} standard-library boundary categories."
review_question = """\
Should one function coordinate this many standard-library \
boundary categories directly?"""

[[rule]]
id = "HS008"
severity = "advisory"
confidence = 0.65
weight = 1.0
message = "Class methods form {count} disconnected field-access clusters."
review_question = """\
Do these clusters represent independently changing \
responsibilities that should have separate owners?"""

[[rule]]
id = "HS012"
severity = "advisory"
confidence = 0.72
weight = 1.0
message = "Class owns {count} state attributes."
review_question = """\
Do subsets of this state have separate invariants, lifetimes, or \
reasons to change?"""

[[rule]]
id = "HS013"
severity = "warning"
confidence = 0.84
weight = 3.0
message = "Large class contains {count} repeated attribute-prefix clusters."
review_question = """\
Does each prefix identify a cohesive value object or component \
hidden inside this class?"""

[[rule]]
id = "HS018"
severity = "warning"
confidence = 0.78
weight = 3.0
message = "Class inherits from {count} parent classes."
review_question = """\
Is this composition, mixin layering, or an inheritance chain \
that hides the real collaborators?"""
